[project]
name = "opencode-plugin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "fastapi>=0.115.0",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.0.1",
    "tqdm>=4.70.1",
    "turbopuffer>=2.9.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
search_opencode_history = "opencode_memory.search:main"
opencode_history = "opencode_memory.daemon:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["opencode_memory*"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "ipython>=9.17.1",
    "pandas-stubs==3.0.5.*",
    "pre-commit>=4.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
